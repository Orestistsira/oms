version: "3.8"
services:
  orders:
    container_name: orders
    build:
      context: .
      dockerfile: orders/Dockerfile
    networks:
      - microservices-network
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - STOCK_GRPC_TARGET=stock:2001
      # - RABBIT_URI=amqp://guest:guest@rabbitmq/
    ports:
      - "2000:2000"

  stock:
    container_name: stock
    build:
      context: .
      dockerfile: stock/Dockerfile
    networks:
      - microservices-network
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      # - RABBIT_URI=amqp://guest:guest@rabbitmq/
    ports:
      - "2001:2001"

  gateway:
    container_name: gateway
    build:
      context: .
      dockerfile: gateway/Dockerfile
    networks:
      - microservices-network
    environment:
      - ORDERS_GRPC_TARGET=orders:2000
    ports:
      - "8000:8000"

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    networks:
      - microservices-network
    volumes:
      - mongo-data:/data/db

networks:
  microservices-network:
    driver: bridge

volumes:
  mongo-data: