syntax = "proto3";

package orders;

import "google/protobuf/timestamp.proto";

// Orders Service

message ItemWithQuantity {
  string item_id = 1;
  int32 quantity = 2;
}

message CreateOrderRequest {
  string customer_id = 1;
  repeated ItemWithQuantity items = 2;
}

message GetOrderRequest {
  string customer_id = 1;
  string order_id = 2;
}

message Item {
  string item_id = 1;
  string name = 2;
  int32 quantity = 3;
  int32 price = 4;
}

message Order {
  string order_id = 1;
  string customer_id = 2;
  repeated Item items = 3;
  string status = 4;
  string payment_link = 5;
  google.protobuf.Timestamp created_at = 6;
}

service Orders {
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc UpdateOrder(Order) returns (Order);
}

// Stock Service

message CheckIfItemsInStockRequest {
  repeated ItemWithQuantity items = 1;
}

message CheckIfItemsInStockResponse {
  bool in_stock = 1;
  repeated Item items = 2;
}

message GetItemsRequest {
  repeated string item_ids = 1;
}

message GetItemsResponse {
  repeated Item items = 1;
}

service Stock {
  rpc CheckIfItemsInStock(CheckIfItemsInStockRequest) returns (CheckIfItemsInStockResponse);
  rpc GetItems(GetItemsRequest) returns (GetItemsResponse);
}
